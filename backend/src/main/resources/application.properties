server.address=127.0.0.1
server.port=${PORT:3000}
server.shutdown=graceful
server.error.include-message=never
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.jackson.default-property-inclusion=non_null
spring.datasource.url=jdbc:sqlite:${DATA_DIR:./work/local-data}/workspace.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
autopost.origin=${PUBLIC_ORIGIN:http://127.0.0.1:5173}
autopost.proxy-secret=${VPS_PROXY_SECRET:}
autopost.data-dir=${DATA_DIR:./work/local-data}
autopost.ai-key=${AI_API_KEY:}
autopost.ai-provider=${AI_PROVIDER:openrouter}
autopost.ai-model=${AI_MODEL:deepseek/deepseek-v4.1-flash-1017}
autopost.vision-model=${AI_VISION_MODEL:google/gemini-3.5-flash-lite}
autopost.dadata-key=${DADATA_API_KEY:}
autopost.dadata-relay-url=${DADATA_RELAY_URL:}
autopost.dadata-relay-token=${DADATA_RELAY_TOKEN:}
autopost.rental-reference-dir=${RENTAL_REFERENCE_DIR:}
