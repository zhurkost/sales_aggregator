map $request_method $autopost_ai_key { default ""; POST $binary_remote_addr; }
limit_req_zone $autopost_ai_key zone=autopost_ai_post:1m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 87.199.205.227;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 308 https://87.199.205.227$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 87.199.205.227;
    ssl_certificate /etc/letsencrypt/live/87.199.205.227/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/87.199.205.227/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:autopost_tls:1m;
    ssl_session_timeout 1d;
    server_tokens off;
    root /opt/autopost/current/dist-vps/client;
    index index.html;
    auth_basic "Autopost MVP";
    auth_basic_user_file /etc/autopost/htpasswd;
    client_max_body_size 24k;
    client_body_timeout 10s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        limit_req zone=autopost_ai_post burst=3 nodelay;
        limit_req_status 429;
        include /etc/autopost/proxy-headers.conf;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:3000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 55s;
    }
    location /assets/ { try_files $uri =404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
